<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Журнал часов</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16' cy='16' r='13' fill='none' stroke='%23b4532a' stroke-width='3'/><path d='M16 9v7l5 3' fill='none' stroke='%23b4532a' stroke-width='3' stroke-linecap='round'/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600&display=swap">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>

<main class="wrap">
  <header class="masthead">
    <div class="eyebrow">Учёт времени</div>
    <h1>Журнал часов</h1>
  </header>

  <section class="summary" aria-live="polite">
    <div class="summary-total">
      <div class="summary-label" id="total-label">Всего</div>
      <div class="summary-value" id="total-value">—</div>
      <div class="summary-note" id="total-note"></div>
    </div>
    <ul class="bars" id="bars"></ul>
  </section>

  <form class="filters" id="filters">
    <label>Месяц
      <select id="f-month"></select>
    </label>
    <label>Проект
      <select id="f-project"></select>
    </label>
    <label>Тип
      <select id="f-type"></select>
    </label>
  </form>

  <div id="log" class="log"></div>
</main>

<script src="assets/app.js"></script>
</body>
</html>
